name: Actomat CI Pipeline

# Când se ruleaza? La orice push pe branch-ul main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # JOB 1: Verificarea Frontend-ului
  build-frontend:
    name: Build Frontend (React)
    runs-on: ubuntu-latest
    # Spunem serverului sa intre in folderul de frontend inainte sa ruleze comenzile
    defaults:
      run:
        working-directory: ./actomat-frontend-tailwind

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./actomat-frontend-tailwind/package-lock.json"

      - name: Install dependencies (Frontend)
        run: npm ci

      - name: Run Build (Frontend)
        run: npm run build

  # JOB 2: Verificarea Backend-ului
  build-backend:
    name: Test Backend (Node.js)
    runs-on: ubuntu-latest
    # Spunem serverului sa intre in folderul de backend
    defaults:
      run:
        working-directory: ./actomat-node-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./actomat-node-backend/package-lock.json"

      - name: Install dependencies (Backend)
        run: npm ci

        # JOB 3: Analiza de securitate pentru întregul Monorepo
  sonarcloud-check:
    name: SonarCloud Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Istoricul complet pentru SonarCloud

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
